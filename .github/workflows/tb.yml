name: tb CI and release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Embedded version for a manual build (dev or a semantic version)'
        required: true
        default: dev
        type: string

permissions:
  contents: read

concurrency:
  group: tb-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

defaults:
  run:
    shell: bash

env:
  SEED_TAG: v0.5.1
  SEED_VERSION: '0.5.1'
  PYTHON_VERSION: '3.12'

jobs:
  version:
    name: Resolve build version
    runs-on: ubuntu-24.04
    outputs:
      value: ${{ steps.version.outputs.value }}
    steps:
      - id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version || 'dev' }}
          RELEASE_TAG: ${{ github.event.release.tag_name || '' }}
        run: |
          set -euo pipefail
          version="$REQUESTED_VERSION"
          if [[ "$GITHUB_EVENT_NAME" == release ]]; then
            version="${RELEASE_TAG#v}"
            if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9][A-Za-z0-9.-]*)?$ ]]; then
              echo "Unsupported release tag: $RELEASE_TAG" >&2
              exit 1
            fi
          elif [[ "$GITHUB_REF_TYPE" == tag ]]; then
            version="${GITHUB_REF_NAME#v}"
          fi
          if [[ "$version" != dev && ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9][A-Za-z0-9.-]*)?$ ]]; then
            echo "Unsupported embedded version: $version" >&2
            exit 1
          fi
          printf 'value=%s\n' "$version" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    name: Build and test (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            runner: ubuntu-24.04
            os: Linux
            arch: x86_64
            seed_asset: tb-0.5.1-linux-x86_64.tar.gz
            seed_sha256: c8cd1b621d832038ca76d1f13026dd00b346584f0388f146ae72edb9c01556f5
            seed_member: tb-0.5.1-linux-x86_64/libexec/tb
          - target: macos-arm64
            # The current macOS seed requires macOS 26 or newer.
            runner: macos-26
            os: Darwin
            arch: arm64
            seed_asset: tb-0.5.1-macos-arm64.zip
            seed_sha256: c31b116d5613d904a7608f1d075468f4d0b4bf8cf37251365bc40f4d44ec1c08
            seed_member: tb-0.5.1-macos-arm64/libexec/tb
    env:
      TARGET: ${{ matrix.target }}
      EXPECTED_OS: ${{ matrix.os }}
      EXPECTED_ARCH: ${{ matrix.arch }}
      SEED_ASSET: ${{ matrix.seed_asset }}
      SEED_SHA256: ${{ matrix.seed_sha256 }}
      SEED_MEMBER: ${{ matrix.seed_member }}
      TB_VERSION: ${{ needs.version.outputs.value }}

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Select native toolchain
        run: |
          set -euo pipefail
          test "$(uname -s)" = "$EXPECTED_OS"
          test "$(uname -m)" = "$EXPECTED_ARCH"
          mkdir -p .build/ci-toolchain .build/ci
          if [[ "$RUNNER_OS" == Linux ]]; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends clang-19 build-essential curl ca-certificates
            ln -s "$(command -v clang-19)" .build/ci-toolchain/clang
          else
            ln -s "$(xcrun --find clang)" .build/ci-toolchain/clang
            sdk_path="$(xcrun --sdk macosx --show-sdk-path)"
            test -d "$sdk_path"
            printf 'SDKROOT=%s\n' "$sdk_path" >> "$GITHUB_ENV"
            echo 'MACOSX_DEPLOYMENT_TARGET=26.0' >> "$GITHUB_ENV"
            printf 'macOS SDK: %s\n' "$sdk_path" | tee .build/ci/macos-sdk.log
          fi
          printf '%s\n' "$PWD/.build/ci-toolchain" >> "$GITHUB_PATH"
          .build/ci-toolchain/clang --version | tee .build/ci/clang-version.log
          python3 --version | tee .build/ci/python-version.log

      - name: Cache pinned seed archive
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/tb-seed-cache
          key: tb-seed-${{ runner.os }}-${{ runner.arch }}-${{ env.SEED_TAG }}-${{ matrix.seed_sha256 }}

      - name: Download, verify, and install seed
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tb-seed-cache"
          export SEED_ARCHIVE="$RUNNER_TEMP/tb-seed-cache/$SEED_ASSET"
          if [[ ! -f "$SEED_ARCHIVE" ]]; then
            curl --fail --location --retry 3 --proto '=https' --proto-redir '=https' \
              "https://github.com/torgnil/tb/releases/download/$SEED_TAG/$SEED_ASSET" \
              -o "$SEED_ARCHIVE"
          fi
          python3 - <<'PY'
          import hashlib, os, pathlib, tarfile, zipfile
          archive = pathlib.Path(os.environ['SEED_ARCHIVE'])
          actual = hashlib.sha256(archive.read_bytes()).hexdigest()
          if actual != os.environ['SEED_SHA256']:
              raise SystemExit('Seed archive SHA-256 mismatch; remove the cached archive and retry')
          member = os.environ['SEED_MEMBER']
          if archive.name.endswith('.zip'):
              with zipfile.ZipFile(archive) as z:
                  data = z.read(member)
          else:
              with tarfile.open(archive, 'r:gz') as t:
                  entry = t.getmember(member)
                  if not entry.isfile():
                      raise SystemExit('Seed archive member must be a regular file')
                  with t.extractfile(entry) as f:
                      data = f.read()
          seed = pathlib.Path('.build/ci-seed/tb-ir').resolve()
          seed.parent.mkdir(parents=True, exist_ok=True)
          seed.write_bytes(data)
          seed.chmod(0o755)
          binary_sha = hashlib.sha256(data).hexdigest()
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write(f'TB_BOOTSTRAP_COMPILER={seed}\nTB_BOOTSTRAP_SHA256={binary_sha}\n')
          print(f'Archive SHA-256: {actual}\nBinary SHA-256: {binary_sha}')
          PY
          test "$(.build/ci-seed/tb-ir --version)" = "tb $SEED_VERSION"

      - name: Build stage2 with the released native seed
        run: |
          set -euo pipefail
          ./build_tb.sh 2>&1 | tee .build/ci/build.log
          test "$(bin/tb --version)" = "tb $TB_VERSION"

      - name: Run native fixtures
        run: |
          set -euo pipefail
          # Linux fixture links need libm. Keep this platform workaround outside
          # the self-hosted fixture verifier.
          if [[ "$RUNNER_OS" == Linux ]]; then
            real_clang="$(command -v clang)"
            shim_dir="$RUNNER_TEMP/tb-fixture-tools"
            mkdir -p "$shim_dir"
            cat > "$shim_dir/clang" <<'SH'
          #!/bin/sh
          for arg do
            if [ "$arg" = "-c" ]; then
              exec "$TB_CI_REAL_CLANG" "$@"
            fi
          done
          exec "$TB_CI_REAL_CLANG" "$@" -lm
          SH
            chmod +x "$shim_dir/clang"
            export TB_CI_REAL_CLANG="$real_clang"
            export PATH="$shim_dir:$PATH"
          fi
          ./verify_fixtures_tb.sh tests/fixtures \
            --compiler bin/tb --build-root .build/fixtures_ci \
            2>&1 | tee .build/ci/fixtures.log

      - name: Check self-hosting generation stability
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          bin/tb compiler/tb/tb.tb .build/stage2/tb_stage3.ll \
            2>&1 | tee .build/ci/generation.log
          cmp .build/stage2/tb_stage2.ll .build/stage2/tb_stage3.ll
          echo 'Stage2/stage3 LLVM is byte-identical.' | tee -a .build/ci/generation.log

      - name: Package native compiler
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib, shutil, subprocess, tarfile, zipfile
          version, target = os.environ['TB_VERSION'], os.environ['TARGET']
          name = f'tb-{version}-{target}'
          root = pathlib.Path('.build/ci-package') / name
          if root.exists():
              shutil.rmtree(root)
          (root / 'libexec').mkdir(parents=True)
          shutil.copy2('bin/tb', root / 'libexec/tb')

          (root / 'tb-ir').write_text(
              '#!/bin/sh\n'
              'set -eu\n'
              'bundle_root=$(CDPATH= cd -- "$(dirname "$0")" && pwd)\n'
              'exec "$bundle_root/libexec/tb" "$@"\n')
          (root / 'tb').write_text(
              '#!/bin/sh\n'
              'set -eu\n'
              'bundle_root=$(CDPATH= cd -- "$(dirname "$0")" && pwd)\n'
              'usage() {\n'
              '    echo "Usage: tb INPUT.tb [CLANG_ARG...] [-o OUTPUT]"\n'
              '    echo "       tb --version"\n'
              '    echo "Builds a native executable beside INPUT.tb by default."\n'
              '}\n'
              'if [ "$#" -eq 0 ]; then\n'
              '    usage >&2\n'
              '    exit 2\n'
              'fi\n'
              'case "$1" in\n'
              '    --version) exec "$bundle_root/tb-ir" "$@" ;;\n'
              '    --help|-h) usage; exit 0 ;;\n'
              'esac\n'
              'input=$1\n'
              'shift\n'
              'case "$input" in\n'
              '    *.tb) output=${input%.tb} ;;\n'
              '    *) echo "expected a .tb source file: $input" >&2; exit 2 ;;\n'
              'esac\n'
              'set -- -o "$output" "$@"\n'
              'scratch_dir=$(mktemp -d "${TMPDIR:-/tmp}/tb-native.XXXXXX")\n'
              'cleanup() { rm -rf "$scratch_dir"; }\n'
              'trap cleanup 0\n'
              'trap \'exit 1\' HUP INT TERM\n'
              'llvm_file="$scratch_dir/program.ll"\n'
              '"$bundle_root/tb-ir" "$input" "$llvm_file"\n'
              'for suffix in cflags csources linkflags; do\n'
              '    metadata_file="$llvm_file.$suffix"\n'
              '    [ -f "$metadata_file" ] || continue\n'
              '    while IFS= read -r value || [ -n "$value" ]; do\n'
              '        [ -n "$value" ] || continue\n'
              '        set -- "$@" "$value"\n'
              '    done < "$metadata_file"\n'
              'done\n'
              + ('clang "$@" "$llvm_file" -lm\n' if target.startswith('linux-')
               else 'clang "$@" "$llvm_file"\n'))

          shutil.copy2('LICENSE', root / 'LICENSE')
          shutil.copy2('docs/tb.md', root / 'tb.md')
          changelog = pathlib.Path('CHANGELOG.md').read_text(encoding='utf-8')
          changelog = changelog.replace('](docs/tb.md)', '](tb.md)')
          (root / 'CHANGELOG.md').write_text(changelog, encoding='utf-8')
          (root / 'VERSION').write_text(version + '\n', encoding='ascii')
          shutil.copy2('.build/stage2/bootstrap.json', root / 'bootstrap.json')
          binary_sha = hashlib.sha256((root / 'libexec/tb').read_bytes()).hexdigest()
          commit = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          metadata = dict(version=version, target=target, commit=commit, stage=2,
                          binary_sha256=binary_sha,
                          clang=subprocess.check_output(['clang', '--version'], text=True),
                          generation_check=os.environ['GITHUB_EVENT_NAME'] != 'pull_request')
          (root / 'build-info.json').write_text(json.dumps(metadata, indent=2) + '\n')
          (root / 'SHA256SUMS').write_text(binary_sha + '  libexec/tb\n')
          readme = pathlib.Path('README.release.md').read_text(encoding='utf-8')
          readme = readme.replace('@VERSION@', version)
          (root / 'README.md').write_text(readme, encoding='utf-8')
          executables = {root / 'tb', root / 'tb-ir', root / 'libexec/tb'}
          for p in [root, *root.rglob('*')]:
              p.chmod(0o755 if p.is_dir() or p in executables else 0o644)
          dist = pathlib.Path('dist')
          dist.mkdir(exist_ok=True)
          if target.startswith('macos-'):
              archive = dist / f'{name}.zip'
              with zipfile.ZipFile(archive, 'w', zipfile.ZIP_DEFLATED) as z:
                  for p in sorted(root.rglob('*')):
                      if p.is_file():
                          z.write(p, arcname=str(pathlib.Path(name) / p.relative_to(root)))
          else:
              archive = dist / f'{name}.tar.gz'
              with tarfile.open(archive, 'w:gz') as t:
                  t.add(root, arcname=name)
          digest = hashlib.sha256(archive.read_bytes()).hexdigest()
          archive.with_name(archive.name + '.sha256').write_text(digest + '  ' + archive.name + '\n')
          print(f'{archive}: {digest}')
          PY

      - name: Upload distributable artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tb-dist-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

      - name: Upload build and test diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tb-logs-${{ matrix.target }}
          path: |
            .build/ci/*.log
            .build/stage2/bootstrap.json
            .build/stage2/tb_stage1.ll
            .build/stage2/tb_stage2.ll
            .build/stage2/tb_stage3.ll
          if-no-files-found: ignore
          retention-days: 7

  windows:
    name: Build and test (windows-x86_64)
    needs: version
    uses: ./.github/workflows/windows-seed.yml
    with:
      version: ${{ needs.version.outputs.value }}

  attach-release-assets:
    name: Attach verified builds to published release
    if: github.event_name == 'release' && github.event.action == 'published'
    needs: [version, build, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download verified platform bundles
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: tb-dist-*
          merge-multiple: true
          path: release-files

      - name: Attach archives and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          TB_VERSION: ${{ needs.version.outputs.value }}
        run: |
          set -euo pipefail
          cd release-files
          archives=(
            "tb-$TB_VERSION-linux-x86_64.tar.gz"
            "tb-$TB_VERSION-macos-arm64.zip"
            "tb-$TB_VERSION-windows-x86_64.zip"
          )
          assets=()
          for archive in "${archives[@]}"; do
            test -s "$archive"
            sha256sum --check "$archive.sha256"
            assets+=("$archive" "$archive.sha256")
          done
          gh release upload "$RELEASE_TAG" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber
